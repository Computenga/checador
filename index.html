<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Checador Packatelas</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E1726;color:#E2E8F0;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:16px}h1{font-size:24px}</style>
</head><body><main><h1>Este checador ya no está en uso</h1><p>Ahora se checa con la huella en el checador de la base.</p></main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));</script>
</body></html>
