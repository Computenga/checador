<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<meta name="robots" content="noindex">
<title>Checador Packatelas · Kiosco</title>
<link rel="manifest" href="kiosco.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checador">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="kiosco.css">
</head>
<body class="kiosco">

<!-- Cámara: solo para la foto de cada checada -->
<div class="camara" id="cajaCam">
  <video id="cam" autoplay playsinline muted></video>
  <div class="camara-etq" id="camEtq">● Foto de checada</div>
</div>

<!-- ============ PANTALLA PRINCIPAL ============ -->
<main class="k-principal" id="vPrincipal">
  <div class="k-cabecera" id="cabecera" title="Mantén presionado para administrar">
    <div class="k-reloj" id="reloj">--:--</div>
    <div class="k-fecha" id="fecha"></div>
  </div>
  <div class="k-qr">
    <div class="k-qr-img" id="qr"></div>
    <div class="k-barra"><div id="barraQr"></div></div>
  </div>
  <div class="k-instr" id="instr">Escanea con la cámara de tu celular y pon tu huella</div>
  <div class="k-pie" id="pie"></div>
</main>

<!-- ============ RESULTADO DE UNA CHECADA ============ -->
<section class="k-capa oculto" id="vResultado" aria-live="assertive">
  <div class="k-res">
    <img class="k-foto" id="rFoto" alt="">
    <div class="k-tipo" id="rTipo"></div>
    <div class="k-nombre" id="rNombre"></div>
    <div class="k-detalle" id="rDetalle"></div>
    <div class="k-barra k-barra-res"><div id="barraRes"></div></div>
    <div class="k-tipos" id="rTipos"></div>
    <div class="k-acciones" id="rAcciones">
      <button class="boton k-btn" id="bConfirmar">Confirmar</button>
    </div>
  </div>
</section>

<!-- ============ REGISTRAR CELULAR ============ -->
<section class="k-capa oculto" id="vAlta">
  <div class="k-res">
    <div class="k-titulo" id="aTitulo"></div>
    <div class="k-detalle">Escanea este QR con la cámara de <b>TU</b> celular y pon tu huella.</div>
    <div class="k-qr k-qr-alta" id="aCaja"><div class="k-qr-img" id="aQr"></div></div>
    <div class="k-listo oculto" id="aListo"></div>
    <div class="k-detalle" id="aEstado">Esperando al celular…</div>
    <button class="boton secundario k-btn" id="bCerrarAlta">Cerrar</button>
  </div>
</section>

<!-- ============ ADMINISTRACIÓN ============ -->
<section class="k-capa k-admin oculto" id="vAdmin">
  <div class="k-admin-caja">
    <div class="k-admin-cab">
      <h1>Administración</h1>
      <button class="k-chico" id="bSalirAdmin">Volver al checador</button>
    </div>
    <nav class="k-tabs">
      <button data-tab="tEmp" class="activo">Empleados</button>
      <button data-tab="tCfg">Configuración</button>
      <button data-tab="tEst">Estado</button>
    </nav>

    <div class="k-tab" id="tEmp">
      <div class="k-fila-btn">
        <button class="k-chico pri" id="bNuevo">+ Empleado</button>
        <button class="k-chico" id="bRecargar">Actualizar lista</button>
        <label class="k-chico">Importar respaldo de la app<input type="file" id="fImportar" accept=".json,application/json" hidden></label>
      </div>
      <div id="listaEmp" class="k-lista"></div>
    </div>

    <div class="k-tab oculto" id="tCfg">
      <form id="fCfg" class="k-form">
        <label>URL de Apps Script (termina en /exec)<input id="cUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label>Token (el mismo del script)<input id="cToken" required autocomplete="off"></label>
        <label>ID de este kiosco (sin espacios)<input id="cKiosko" required pattern="[A-Za-z0-9_\-]{1,40}" placeholder="BASE-OBRERA"></label>
        <label>Nombre de este dispositivo<input id="cDisp" required placeholder="Tablet recepción"></label>
        <label>PIN de administrador (mínimo 4 dígitos)<input id="cPin" inputmode="numeric" pattern="[0-9]{4,8}" required></label>
        <button class="boton k-btn" type="submit">Guardar y probar conexión</button>
        <div id="cMsg" class="aviso oculto"></div>
      </form>
    </div>

    <div class="k-tab oculto" id="tEst">
      <div id="estado" class="k-estado"></div>
      <div class="k-fila-btn">
        <button class="k-chico pri" id="bEnviar">Enviar pendientes ahora</button>
        <button class="k-chico" id="bCompleta">Pantalla completa</button>
      </div>
      <div class="k-sub">Dejarlo como kiosco</div>
      <div class="k-nota k-inst" id="instKiosco"></div>
    </div>
  </div>
</section>

<!-- Diálogo de empleado -->
<section class="k-capa k-admin oculto" id="vEmp">
  <form class="k-admin-caja k-form" id="fEmp">
    <h1 id="eTitulo">Nuevo empleado</h1>
    <label>Número de empleado<input id="eNum" required autocomplete="off"></label>
    <label>Nombre completo<input id="eNom" required autocomplete="off"></label>
    <div class="k-sub">Checadas que le tocan</div>
    <div class="k-fila-btn" id="ePerfiles"></div>
    <div id="eTipos" class="k-checks"></div>
    <div id="eMsg" class="aviso error oculto"></div>
    <div class="k-fila-btn">
      <button class="k-chico pri" type="submit" id="eGuardarCel">Guardar y registrar celular</button>
      <button class="k-chico" type="button" id="eGuardar">Solo guardar</button>
      <button class="k-chico" type="button" id="eCancelar">Cancelar</button>
    </div>
  </form>
</section>

<!-- PIN -->
<section class="k-capa oculto" id="vPin">
  <form class="k-res k-form k-pin" id="fPin">
    <div class="k-titulo">PIN de administrador</div>
    <input id="pIn" type="password" inputmode="numeric" autocomplete="off" required>
    <div class="k-fila-btn">
      <button class="boton k-btn" type="submit">Entrar</button>
      <button class="boton secundario k-btn" type="button" id="bPinCancelar">Cancelar</button>
    </div>
  </form>
</section>

<div class="k-toast oculto" id="toast"></div>

<script src="qrcode.js"></script>
<script src="verif.js"></script>
<script src="kiosco.js"></script>
</body>
</html>
